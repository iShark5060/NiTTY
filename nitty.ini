; ============================================================================
; NiTTY — sample nitty.ini (ship beside NiTTY.exe or Pageant.exe)
; ============================================================================
;
; IMPORTANT: NiTTY is not a full KiTTY clone. Only the keys documented below
; are read from this file. Any legacy KiTTY/kitty.ini options (Agent,
; ConfigBox, Shortcuts, Launcher, Print, and most [NiTTY] toggles) are
; IGNORED — they are not implemented in this codebase.
;
; Everything else (colours, SSH, terminal, fonts, scripts, etc.) is stored in:
;   • Portable mode: files under <configdir>\\Sessions\\ (and related dirs)
;   • Normal mode: Windows registry under the usual PuTTY/NiTTY settings key
; Configure those through the NiTTY GUI, not this file.
;
; Source of truth for portable bootstrap: windows/nitty_portable.c
; ============================================================================

[NiTTY]
; ---------------------------------------------------------------------------
; Portable directory layout (KiTTY-style "save all beside the exe")
; ---------------------------------------------------------------------------
; Enable by setting savemode=dir. Requires this nitty.ini next to NiTTY.exe
; (or next to the exe whose folder you treat as the config root).
;
; When enabled, NiTTY uses a directory tree under <configdir> instead of the
; registry for sessions, host keys, random seed, jumplist metadata, etc.:
;   Sessions\\       — one file per saved session (see fileextension)
;   SshHostKeys\\    — cached SSH host keys
;   SshHostCAs\\     — SSH host CA definitions
;   Jumplist\\        — jump list / recent session data
;   putty.rnd         — random number seed (file in config root)
;   Pageant\\         — optional Pageant key list (see [Pageant] section)
;
savemode=dir

; Optional: override where the config tree lives.
;   • Empty — use the same folder as the executable (typical portable USB layout).
;   • Relative path — relative to the exe directory (e.g. data or .\\profile).
;   • Absolute path — e.g. D:\\SSH\\NiTTY-Config
;configdir=

; Session file suffix when savemode=dir (leading dot optional).
; Example: myserver.ktx  if fileextension=ktx
;fileextension=.ktx

; ---------------------------------------------------------------------------
; NOT READ from nitty.ini (configure in the GUI or session files instead)
; ---------------------------------------------------------------------------
; Examples of legacy KiTTY options that have NO effect in NiTTY:
;   adb, autoreconnect, backgroundimage, capslock, conf, ctrltab, cygterm,
;   hyperlink, icon, mouseshortcuts, paste, shortcuts, transparency, winrol,
;   wintitle, zmodem, ReconnectDelay, scriptmode, PlinkPath, PSCPPath, ...
; NiTTY may implement a small subset of KiTTY ideas elsewhere (e.g. conf.h /
; registry keywords), but they are not loaded from this INI file.


[Pageant]
; ---------------------------------------------------------------------------
; Optional: remember private key file paths when using portable mode
; ---------------------------------------------------------------------------
; Requires [NiTTY] savemode=dir above. Pageant reads nitty.ini from the same
; directory as NiTTY when NiTTY.exe is found beside Pageant, or from Pageant's
; own directory if you only ship pageant.exe.
;
; When enabled, Pageant loads paths from:
;   <configdir>\\Pageant\\pageant-keys.txt
; and rewrites that file when keys are added or removed.
;
savemode=dir
PersistKeys=1
