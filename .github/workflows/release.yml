name: NiTTY Release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.83). Leave empty to use LATEST.VER.
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a pre-release
        required: false
        type: boolean
        default: false
      draft:
        description: Create the GitHub release as a draft
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ -f LATEST.VER ]; then
            version="$(tr -d '[:space:]' < LATEST.VER)"
          else
            echo "ERROR: No version input and LATEST.VER is missing."
            exit 1
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "ERROR: Version must match X.YY (got '$version')."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version $version (tag v$version)"

  build:
    runs-on: windows-latest
    timeout-minutes: 30

    needs: [prepare]

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate version.h
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $parts = $version.Split('.')
          if ($parts.Count -ne 2) {
            throw "Expected version in X.YY form, got '$version'"
          }
          $major = $parts[0]
          $minor = $parts[1]
          @"
          /* Generated by GitHub Actions release workflow */
          #define RELEASE $version
          #define TEXTVER "Release $version"
          #define SSHVER "-Release-$version"
          #define BINARY_VERSION $major,$minor,0,0
          "@ | Set-Content -Encoding utf8NoBOM version.h

      - name: Configure CMake
        id: cmake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $generators = @(
            'Visual Studio 18 2026',
            'Visual Studio 17 2022'
          )
          $configured = $false
          foreach ($gen in $generators) {
            Write-Host "Trying CMake generator: $gen"
            if (Test-Path build) {
              Remove-Item -Recurse -Force build
            }
            cmake -S . -B build -G $gen -A x64
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Configured with generator: $gen"
              "generator=$gen" >> $env:GITHUB_OUTPUT
              "binary_dir=build/Release" >> $env:GITHUB_OUTPUT
              $configured = $true
              break
            }
          }
          if (-not $configured) {
            throw 'No supported Visual Studio installation found (tried VS 2026 and VS 2022 generators)'
          }

      - name: Build Release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build --config Release --parallel

      - name: Package release archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $stage = "dist/NiTTY-$version-win64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $shipped = Get-Content build/shipped.txt | Where-Object { $_.Trim() -ne '' }
          $binaryDir = '${{ steps.cmake.outputs.binary_dir }}'
          foreach ($name in $shipped) {
            $path = Join-Path $binaryDir $name.Trim()
            if (-not (Test-Path $path)) {
              throw "Expected shipped binary is missing: $path"
            }
            Copy-Item $path $stage
          }

          foreach ($extra in @('nitty.ini', 'LICENCE', 'README.md')) {
            if (-not (Test-Path $extra)) {
              throw "Expected release file is missing: $extra"
            }
            Copy-Item $extra $stage
          }

          $archive = "dist/NiTTY-$version-win64.zip"
          if (Test-Path $archive) { Remove-Item $archive }
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          Get-ChildItem dist

      - name: Attest release artifact
        uses: actions/attest@v4
        with:
          subject-path: dist/NiTTY-${{ needs.prepare.outputs.version }}-win64.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: nitty-win64-${{ needs.prepare.outputs.version }}
          path: dist/NiTTY-${{ needs.prepare.outputs.version }}-win64.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: [prepare, build]

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: nitty-win64-${{ needs.prepare.outputs.version }}
          path: dist

      - name: Verify release attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "dist/NiTTY-${{ needs.prepare.outputs.version }}-win64.zip" \
            --repo "${{ github.repository }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: NiTTY ${{ needs.prepare.outputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/NiTTY-${{ needs.prepare.outputs.version }}-win64.zip
          fail_on_unmatched_files: true

  discord-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: [prepare, build, release]
    if: ${{ always() }}

    steps:
      - name: Send Discord status
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        uses: iShark5060/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || contains(needs.*.result, 'skipped') && 'skipped' || 'success' }}
          content: '<@${{ secrets.DISCORD_USERID }}>'
          title: ${{ github.workflow }}
          description: ${{ contains(needs.*.result, 'failure') && format('Release v{0} failed. Review workflow logs before retrying.', needs.prepare.outputs.version) || contains(needs.*.result, 'cancelled') && format('Release v{0} was cancelled.', needs.prepare.outputs.version) || contains(needs.*.result, 'skipped') && format('Release v{0} was skipped.', needs.prepare.outputs.version) || format('Release v{0} succeeded. Windows x64 build is published.', needs.prepare.outputs.version) }}
          color: ${{ contains(needs.*.result, 'failure') && '0xff0000' || contains(needs.*.result, 'cancelled') && '0xffaa00' || contains(needs.*.result, 'skipped') && '0x808080' || '0x00ff00' }}
